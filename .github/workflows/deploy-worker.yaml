
name: Deploy worker to dev environment
on:
    push:
        branches:
            - dev
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Checking out the code"

            - name: Checkout code
              uses: actions/checkout@v4

            - run: echo "installing bun"

            - name: Install bun
              uses: oven-sh/setup-bun@v1

            - run: echo "Installing code dependencies"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - run: echo "Deploying to cloudflare dev environment"

            - name: Deploy to cloudflare dev environment
              working-directory: ./apps/worker
              run: bunx wrangler deploy --env=dev
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}


